<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../assets/images/favicon.ico"
      type="image/x-icon"
    />
    <title>Account Setting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Filled"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container max-w-[768px]">
      <!-- App Bar -->
      <div
        class="fixed left-0 top-0 z-10 flex w-full items-center gap-5 bg-white p-4 text-gray-900"
      >
        <a
          href="#"
          class="hover:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-400"
          onclick="history.back()"
        >
          <span class="material-symbols-outlined"> arrow_back </span>
        </a>
        <p class="text-lg font-semibold">Pengaturan Akun</p>
      </div>
      <!-- ./ App Bar -->
      <div class="flex min-h-dvh flex-col gap-4 bg-green-50 pb-[80px]">
        <div class="mt-[92px] flex w-full flex-col gap-8 p-4">
          <!-- Card Informasi Personal -->
          <form
            action="#"
            method="post"
            class="flex flex-col gap-4 rounded-[20px] bg-white p-2.5 shadow-md"
          >
            <!-- Title -->
            <div class="mb-6 ps-4 text-xl font-semibold text-gray-900">
              Informasi Personal
            </div>
            <!-- ./Title -->
            <!-- Input File  -->
            <div class="mb-6 flex justify-center">
              <label for="file-upload" class="cursor-pointer">
                <div
                  class="flex size-[100px] items-center justify-center rounded-full bg-gray-300 hover:opacity-70"
                >
                  <span class="material-symbols-outlined text-xl text-gray-900"
                    >upload</span
                  >
                </div>
                <input type="file" id="file-upload" class="hidden" />
              </label>
            </div>
            <!-- ./Input File  -->
            <!-- Input Nama  -->
            <div class="">
              <label
                for="input-namat"
                class="ps-4 text-sm font-medium uppercase text-gray-900"
                >Nama</label
              >
              <div class="relative">
                <input
                  id="my-input-text"
                  type="text"
                  placeholder="Masukkab Nama"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 pe-12 ps-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:outline-none focus:ring-2 focus:ring-green-400 focus:invalid:ring-red-900 disabled:border-gray-400 disabled:bg-gray-100"
                />
                <div
                  class="absolute inset-y-0 start-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="material-symbols-outlined text-md">person</span>
                </div>
                <div
                  class="absolute inset-y-0 end-0 flex items-center pe-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                ></div>
              </div>
            </div>
            <!-- ./Input Nama  -->
            <!-- Input Email  -->
            <div class="">
              <label
                for="input-email"
                class="ps-4 text-sm font-medium uppercase text-gray-900"
                >Email</label
              >
              <div class="relative">
                <input
                  id="my-input-text"
                  type="email"
                  placeholder="Masukkab E-mail"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 pe-12 ps-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:outline-none focus:ring-2 focus:ring-green-400 focus:invalid:ring-red-900 disabled:border-gray-400 disabled:bg-gray-100"
                />
                <div
                  class="absolute inset-y-0 start-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="material-symbols-outlined text-md">mail</span>
                </div>
                <div
                  class="absolute inset-y-0 end-0 flex items-center pe-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                ></div>
              </div>
            </div>
            <!-- ./Input Email  -->
            <!-- Button -->
            <button
              type="button"
              class="inline-flex items-center justify-center gap-2 rounded-xl border border-green-500 bg-transparent p-2.5 text-sm font-semibold uppercase text-green-400 hover:bg-green-900 focus:outline-none focus:ring-2 focus:ring-green-400 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-200 disabled:bg-transparent disabled:text-gray-400"
            >
              <span class="material-symbols-outlined text-md">save</span>
              <span>Simpan Perubahan</span>
            </button>
            <!-- ./ Button -->
          </form>
          <!-- ./Card Informasi Personal -->
          <!-- Card Informasi Personal -->
          <form
            action="#"
            method="post"
            class="flex flex-col gap-4 rounded-[20px] bg-white p-2.5 shadow-md"
          >
            <!-- Title -->
            <div class="mb-6 ps-4 text-xl font-semibold text-gray-900">
              Keamanan Pin
            </div>
            <!-- ./Title -->

            <!-- Input pin lama  -->
            <div class="">
              <label
                for="input-pin"
                class="ps-4 text-sm font-medium uppercase text-gray-900"
                >Pin Lama</label
              >
              <div class="relative">
                <input
                  id="my-input-number"
                  type="number"
                  placeholder="Masukan 6 digit PIN lama"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 pe-12 ps-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:outline-none focus:ring-2 focus:ring-green-400 focus:invalid:ring-red-900 disabled:border-gray-400 disabled:bg-gray-100"
                />
                <div
                  class="absolute inset-y-0 start-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="material-symbols-outlined text-md"
                    >security</span
                  >
                </div>
                <div
                  class="absolute inset-y-0 end-0 flex items-center pe-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                ></div>
              </div>
            </div>
            <!-- ./Input pin lama  -->
            <!-- Input pin Baru  -->
            <div class="">
              <label
                for="input-pin"
                class="ps-4 text-sm font-medium uppercase text-gray-900"
                >Pin Baru</label
              >
              <div class="relative">
                <input
                  id="my-input-number"
                  type="number"
                  placeholder="Buat 6 digit PIN baru"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 pe-12 ps-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:outline-none focus:ring-2 focus:ring-green-400 focus:invalid:ring-red-900 disabled:border-gray-400 disabled:bg-gray-100"
                />
                <div
                  class="absolute inset-y-0 start-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="material-symbols-outlined text-md"
                    >security</span
                  >
                </div>
                <div
                  class="absolute inset-y-0 end-0 flex items-center pe-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                ></div>
              </div>
            </div>
            <!-- ./Input pin Baru  -->
            <!-- Konfirmasi pin   -->
            <div class="">
              <label
                for="input-pin"
                class="ps-4 text-sm font-medium uppercase text-gray-900"
                >Konfirmasi Pin</label
              >
              <div class="relative">
                <input
                  id="my-input-number"
                  type="number"
                  placeholder="Konfirmasi 6 digit PIN baru"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 pe-12 ps-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:outline-none focus:ring-2 focus:ring-green-400 focus:invalid:ring-red-900 disabled:border-gray-400 disabled:bg-gray-100"
                />
                <div
                  class="absolute inset-y-0 start-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="material-symbols-outlined text-md"
                    >security</span
                  >
                </div>
                <div
                  class="absolute inset-y-0 end-0 flex items-center pe-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                ></div>
              </div>
            </div>
            <!-- ./Input pin Baru  -->

            <!-- Button -->
            <button
              type="button"
              class="inline-flex items-center justify-center gap-2 rounded-xl border border-green-500 bg-transparent p-2.5 text-sm font-semibold uppercase text-green-400 hover:bg-green-900 focus:outline-none focus:ring-2 focus:ring-green-400 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-200 disabled:bg-transparent disabled:text-gray-400"
            >
              <span class="material-symbols-outlined text-md">save</span>
              <span>Simpan Perubahan</span>
            </button>
            <!-- ./ Button -->
          </form>
          <!-- ./Card Informasi Personal -->
        </div>
      </div>
      <!-- Navbar -->
      <div
        class="fixed bottom-0 left-0 z-10 flex w-full justify-evenly bg-white"
      >
        <a
          href=""
          class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-400"
        >
          <span
            class="material-symbols-outlined text-md inline text-blue-500 group-hover:hidden"
            >home</span
          >
          <span
            class="material-symbols-outlined text-md hidden group-hover:inline"
            >home</span
          >
          <span>Beranda</span>
        </a>
        <a
          href=""
          class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-400"
        >
          <span
            class="material-symbols-outlined text-md inline text-blue-500 group-hover:hidden"
            >receipt</span
          >
          <span
            class="material-symbols-outlined text-md hidden group-hover:inline"
            >receipt</span
          >
          <span>Riwayat</span>
        </a>
        <a
          href=""
          class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-400"
        >
          <span
            class="material-symbols-outlined text-md inline text-blue-500 group-hover:hidden"
            >person</span
          >
          <span
            class="material-symbols-outlined text-md hidden group-hover:inline"
            >person</span
          >
          <span>Akun</span>
        </a>
      </div>
      <!-- ./Navbar -->
    </div>
  </body>
</html>
