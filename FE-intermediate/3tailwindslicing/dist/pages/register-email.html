<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="../assets/images/favicon.ico" type="image/x-icon">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <div class="container max-w-[768px]">
      <div class="flex h-dvh flex-col items-center justify-center bg-green-50 p-4">

        <div class="flex w-full flex-col">
         <!-- Ilustration -->
             <img src="../assets/images/email-sent.svg" alt="Illustration" class="h-[160px]">
         <!-- // Ilustration -->

         <!-- Title + Description -->
          <div class="mt-8 mb-5 flex flex-col">
            <h1 class="text-center text-lg font-semibold text-gray-900">Konfirmasi Email</h1>
            <p class="text-gray-400 text-center text-xs font-medium">Silahkan cek inbox email Anda dan klik link yang kami kirim untuk konfirmasi email Anda. Jika belum muncul tunggu beberapa menit atau klik tombol ini</p>
          </div>
         <!-- ./ Title + Description -->
          <!-- Form -->
           <form action="#" class="flex flex-col gap-4 mt-4" method="post">
            <!-- Kirim Ulang -->
           <button type="button" class=" justify-center inline-flex items-center bg-transparent border border-green-500 text-green-400 rounded-xl p-2.5 uppercase gap-2 text-sm font-semibold hover:bg-green-900 focus:outline-none focus:ring-2 focus:ring-green-400 disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-transparent disabled:text-gray-400 ">
      <span class="material-symbols-outlined text-md">send</span>
      <span>Kirim Ulang</span>
     
    </button>
            <!-- ./ Kirim Ulang -->

      <!-- Input Email -->
      
      <button type="button" class=" justify-center inline-flex items-center bg-transparent border border-green-500 text-green-400 rounded-xl p-2 uppercase gap-2 text-xs font-semibold hover:bg-green-900 focus:outline-none focus:ring-2 focus:ring-green-400 disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-transparent disabled:text-gray-400 ">
     
      <span>Keluar</span>
    
        <!-- ./ Input Email -->
  
<!-- Button Action -->
<button type="button" class=" justify-center inline-flex items-center bg-green-500 text-white rounded-xl p-2.5 uppercase gap-2 text-sm font-semibold hover:bg-green-900 focus:outline-none focus:ring-2 focus:ring-green-400 disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400">
    
    <span>Lanjutkan</span>
    <span class="material-symbols-outlined text-md">chevron_right</span>
</button>
<!-- ./Button Action -->

<!-- Help Text -->
 <p class="mt-3 text-center text-xs text-neutral-400">Dengan masuk atau daftar, Anda sudah setuju dengan 
    <a href="#" class="text-xs font-semibold text-green-300 hover:text-green-600/70 focus:outline-none focus:ring-2 focus:ring-green-400">Ketentuan Layanan</a> dan <a href="#" class="text-xs font-semibold text-green-300 hover:text-green-600/70 focus:outline-none focus:ring-2 focus:ring-green-400"> Kebijakan Privasi</a> KUSAKU
 </p>
<!-- ./ Help Text -->

           </form>
          <!-- ./ Form -->
        </div>
      </div>
    </div>
</body>
</html>
